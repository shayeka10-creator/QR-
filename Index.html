<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR & Binary Generator | Pro</title>  <!-- QRCode.js -->  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #020617, #020617);
      color: #e5e7eb;
    }
    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    textarea, input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 12px;
      background: #020617;
      color: #e5e7eb;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 10px;
      font-weight: bold;
      background: #22c55e;
      color: #020617;
    }
    button.secondary {
      background: #38bdf8;
    }
    .card {
      background: #020617;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }
    #qrOutput {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }
    a {
      color: #22c55e;
      text-decoration: none;
    }
    .history-item {
      background: #020617;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 13px;
    }
  </style></head>
<body><div class="container">
  <h1>QR & Binary Generator (Pro)</h1>  <textarea id="textInput" placeholder="Write text here..."></textarea>  <input type="file" id="fileInput" /><button onclick="generateQR()">Generate QR</button> <button class="secondary" onclick="generateBinary()">Generate Binary</button>

  <div class="card" id="output"></div>  <h3>History</h3>
  <div id="history"></div>
</div><script>
// Load History
let historyData = JSON.parse(localStorage.getItem('history')) || [];
renderHistory();

function getInputData() {
  const text = document.getElementById('textInput').value;
  const file = document.getElementById('fileInput').files[0];

  if (file) {
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsText(file);
    });
  }
  return Promise.resolve(text);
}

async function generateQR() {
  const data = await getInputData();
  if (!data) return alert('No input found');

  document.getElementById('output').innerHTML = '<div id="qrOutput"></div><br><button onclick="downloadQR()">Download QR</button>';
  const qrDiv = document.getElementById('qrOutput');
  qrDiv.innerHTML = '';
  new QRCode(qrDiv, {
    text: data,
    width: 250,
    height: 250
  });

  saveHistory('QR', data);
}

async function generateBinary() {
  const data = await getInputData();
  if (!data) return alert('No input found');

  let binary = '';
  for (let char of data) {
    binary += char.charCodeAt(0).toString(2) + ' ';
  }

  document.getElementById('output').innerHTML = `
    <textarea rows="6">${binary}</textarea><br><button onclick="downloadBinary(\`${binary}\`)">Download Binary</button>

`;

saveHistory('Binary', data); }

function downloadBinary(content) { const blob = new Blob([content], { type: 'text/plain' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'binary.txt'; a.click(); }

function downloadQR() { const img = document.querySelector('#qrOutput img'); const a = document.createElement('a'); a.href = img.src; a.download = 'qr.png'; a.click(); }

function saveHistory(type, data) { const item = { type, preview: data.substring(0, 50), time: new Date().toLocaleString() }; historyData.unshift(item); localStorage.setItem('history', JSON.stringify(historyData)); renderHistory(); }

function renderHistory() { const h = document.getElementById('history'); h.innerHTML = historyData.map(i => <div class="history-item"> <b>${i.type}</b> | ${i.time}<br> ${i.preview} </div>).join(''); } </script>

</body>
</html>
